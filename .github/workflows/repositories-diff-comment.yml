name: repositories-diff-comment
on:
  # Runs in the context of the base repo so it can comment on fork PRs. It never
  # checks out or runs PR code, and only treats the artifact as data.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows:
    - repositories-diff
    types:
    - completed

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    # concurrent runs could each fail to find the comment and post duplicates
    concurrency:
      group: repositories-diff-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    permissions:
      actions: read
      pull-requests: write
    steps:
    - name: Find PR
      id: pr
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        # Only comment on an open PR whose head is still this commit, which
        # skips stale runs when newer commits have been pushed.
        pr_number=$(gh api --method GET "repos/$REPO/pulls" \
          -f state=open -f "head=$HEAD_OWNER:$HEAD_BRANCH" \
          --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" \
          | head -n 1)
        if [[ -z "$pr_number" ]]; then
          echo "No open PR with head $HEAD_SHA, skipping"
        fi
        echo "number=$pr_number" >> "$GITHUB_OUTPUT"

    - name: Download diff
      if: steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: repositories-diff
        path: ${{ runner.temp }}/repositories-diff
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Post or update comment
      if: steps.pr.outputs.number != ''
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        RUN_URL: ${{ github.event.workflow_run.html_url }}
        DIFF_DIR: ${{ runner.temp }}/repositories-diff
      run: |
        marker='<!-- probe-scraper-repositories-diff -->'
        body_file="$RUNNER_TEMP/body.md"
        # Only a new diff creates a comment. The other states only update an
        # existing comment, so it doesn't keep showing an outdated diff.
        create=false
        if [[ "$CONCLUSION" == "failure" ]]; then
          printf '%s\n### probe-scraper output diff\n\nThe diff failed.\n' "$marker" > "$body_file"
        elif [[ -f "$DIFF_DIR/repositories-unchanged" ]]; then
          printf '%s\n### probe-scraper output diff\n\nThis PR no longer changes `repositories.yaml`.\n' "$marker" > "$body_file"
        else
          # The artifact was produced by PR code, so cap its size. This leaves
          # room for the footer under GitHub's 65536 character limit.
          head -c 65000 "$DIFF_DIR/comment.md" > "$body_file"
          create=true
        fi
        printf '\n---\nGenerated for %s by [this workflow run](%s).\n' "$HEAD_SHA" "$RUN_URL" >> "$body_file"

        comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
          | head -n 1)
        if [[ -n "$comment_id" ]]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body_file"
        elif [[ "$create" == true ]]; then
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body_file"
        fi
