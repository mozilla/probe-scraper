name: repositories-diff-comment
on:
  # Runs in the context of the base repo so it can comment on fork PRs. It never
  # checks out or runs PR code, and only treats the artifact as data.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows:
    - repositories-diff
    types:
    - completed

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
    - name: Download diff
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: repositories-diff
        path: ${{ runner.temp }}/repositories-diff
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Post or update comment
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        DIFF_DIR: ${{ runner.temp }}/repositories-diff
      run: |
        # The artifact was produced by PR code, so validate it before use.
        pr_number=$(head -c 20 "$DIFF_DIR/pr-number" | tr -d '[:space:]')
        if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
          echo "Invalid PR number in artifact"
          exit 1
        fi
        # Only comment on the PR the run was for. This also skips stale runs
        # when newer commits have been pushed.
        pr_head_sha=$(gh api "repos/$REPO/pulls/$pr_number" --jq .head.sha)
        if [[ "$pr_head_sha" != "$HEAD_SHA" ]]; then
          echo "PR #$pr_number head is $pr_head_sha, not $HEAD_SHA, skipping"
          exit 0
        fi

        body_file="$RUNNER_TEMP/body.md"
        head -c 65536 "$DIFF_DIR/comment.md" > "$body_file"

        marker='<!-- probe-scraper-repositories-diff -->'
        comment_id=$(gh api --paginate "repos/$REPO/issues/$pr_number/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
          | head -n 1)
        if [[ -n "$comment_id" ]]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body_file"
        else
          gh api --method POST "repos/$REPO/issues/$pr_number/comments" -F "body=@$body_file"
        fi
