name: repositories-diff
on:
  pull_request:
    paths:
    - repositories.yaml

permissions: {}

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
        # the base branch is the first parent of the PR merge commit
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install
      run: |
        pip install -r requirements.txt
        pip install .

    - name: Diff output
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        git show HEAD^1:repositories.yaml > "$RUNNER_TEMP/base-repositories.yaml"
        python -m probe_scraper.repositories_diff \
          --base-file "$RUNNER_TEMP/base-repositories.yaml" \
          --head-file repositories.yaml \
          --output-dir diff-output
        echo "$PR_NUMBER" > diff-output/pr-number
        cat diff-output/comment.md >> "$GITHUB_STEP_SUMMARY"

    # Fork PRs get a read-only token, so the comment is posted by
    # repositories-diff-comment.yml using this artifact.
    - name: Upload diff
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: repositories-diff
        path: diff-output/
